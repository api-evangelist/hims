name: Hims
description: >-
  Hims is the men's brand of Hims & Hers Health, Inc. (NYSE: HIMS), a U.S.-based
  direct-to-consumer telehealth platform. Through forhims.com it connects patients
  with licensed medical providers and affiliated pharmacies to offer treatment for
  sexual health, hair loss, dermatology and skincare, mental health, and weight loss,
  including provider consultations, personalized prescriptions, and recurring
  subscription fulfillment shipped to the customer. Hims & Hers operates the sibling
  Hers brand for women and runs its own pharmacy and fulfillment operations. This
  API Evangelist profile tracks the company's public developer, security, and trust
  surface; Hims does not currently publish a public developer API, so this record is
  identity- and security-focused rather than spec-bearing.
